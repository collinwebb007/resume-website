<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Planet 2: Crimson Dynamo / Mars -->
  <defs>
    <clipPath id="mars-clip">
      <circle cx="32" cy="32" r="24"/>
    </clipPath>
  </defs>
  <!-- Atmospheric Glow -->
  <circle cx="32" cy="32" r="24" fill="#f43f5e" filter="blur(2px)" opacity="0.35"/>
  <!-- Base Sphere -->
  <circle cx="32" cy="32" r="24" fill="#f87171"/>
  <!-- Surface Texture & Marbling (Clipped) -->
  <g clip-path="url(#mars-clip)">
    <!-- Swirling crimson bands -->
    <path d="M8 26 Q 22 20, 36 28 T 56 22 L 56 42 Q 42 46, 26 38 T 8 46 Z" fill="#dc2626"/>
    <path d="M12 18 Q 28 14, 44 22 L 48 16 Q 30 10, 16 12 Z" fill="#b91c1c"/>
    <path d="M10 38 Q 28 34, 46 44 L 42 52 Q 24 44, 12 46 Z" fill="#991b1b"/>
    
    <!-- Shadow crescent on bottom right -->
    <path d="M26 56 C38 56 56 46 56 24 C56 40 46 54 34 56 Z" fill="#7f1d1d"/>
    <path d="M38 56 C48 52 56 42 56 30 C56 44 48 54 38 56 Z" fill="#450a0a"/>

    <!-- Bright orange/yellow lava fissures -->
    <rect x="18" y="24" width="10" height="2" fill="#fdba74"/>
    <rect x="24" y="26" width="8" height="2" fill="#fb923c"/>
    <rect x="34" y="32" width="10" height="2" fill="#fdba74"/>
    <rect x="36" y="34" width="6" height="2" fill="#fb923c"/>
    <rect x="16" y="36" width="6" height="2" fill="#fca5a5"/>

    <!-- Dark crater blocks -->
    <rect x="22" y="16" width="6" height="4" fill="#7f1d1d"/>
    <rect x="38" y="22" width="7" height="5" fill="#450a0a"/>
    <rect x="20" y="42" width="8" height="4" fill="#7f1d1d"/>

    <!-- Highlight Rim on Top Left -->
    <path d="M12 24 C10 28 9 32 9 32 C9 20 19 10 32 9 C32 9 20 12 12 24 Z" fill="#fecdd3" opacity="0.6"/>
  </g>
  <!-- Outer Outline Ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
</svg>
