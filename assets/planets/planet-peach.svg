<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <!-- Planet 4: Peach Sandy Moon (Whole Foods style) -->
  <defs>
    <clipPath id="peach-clip">
      <circle cx="32" cy="32" r="24"/>
    </clipPath>
  </defs>
  <!-- Atmospheric Glow -->
  <circle cx="32" cy="32" r="24" fill="#fdba74" filter="blur(2px)" opacity="0.3"/>
  <!-- Base Sphere -->
  <circle cx="32" cy="32" r="24" fill="#fed7aa"/>
  <!-- Surface Texture (Clipped) -->
  <g clip-path="url(#peach-clip)">
    <!-- Warm tan wavy shadows -->
    <path d="M8 30 C12 44 24 56 36 56 C48 56 56 46 56 30 C46 36 34 38 22 36 C14 34 10 32 8 30 Z" fill="#fb923c"/>
    <path d="M26 56 C38 56 56 44 56 24 C56 38 46 52 34 56 Z" fill="#ea580c"/>
    <path d="M38 56 C48 52 56 42 56 30 C56 44 48 54 38 56 Z" fill="#9a3412"/>

    <!-- Sandy craters -->
    <rect x="20" y="16" width="7" height="5" fill="#f97316"/>
    <rect x="22" y="18" width="4" height="3" fill="#c2410c"/>
    <rect x="18" y="17" width="2" height="3" fill="#ffedd5"/>

    <rect x="30" y="26" width="9" height="7" fill="#f97316"/>
    <rect x="32" y="28" width="6" height="4" fill="#9a3412"/>
    <rect x="28" y="27" width="2" height="5" fill="#ffedd5"/>

    <rect x="16" y="38" width="8" height="5" fill="#ea580c"/>
    <rect x="18" y="39" width="5" height="3" fill="#7c2d12"/>

    <rect x="38" y="18" width="6" height="5" fill="#f97316"/>
    <rect x="40" y="20" width="3" height="2" fill="#c2410c"/>

    <!-- Cream swirl stripes -->
    <rect x="12" y="24" width="14" height="2" fill="#ffedd5"/>
    <rect x="36" y="36" width="12" height="2" fill="#ffedd5"/>

    <!-- Highlight Rim on Top Left -->
    <path d="M12 24 C10 28 9 32 9 32 C9 20 19 10 32 9 C32 9 20 12 12 24 Z" fill="#fff7ed" opacity="0.6"/>
  </g>
  <!-- Outer Outline Ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#ea580c" stroke-width="1.5"/>
</svg>
